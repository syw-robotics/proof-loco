[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proof_parkour"
version = "0.0.1"
description = "LocoLab external project."
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
    "locolab",
    # "assetx @ git+https://github.com/syw-robotics/assetx.git",
]

[project.entry-points."locolab.tasks"]
proof_parkour = "proof_parkour.tasks"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["proof_parkour*"]

[tool.setuptools.package-data]
proof_parkour = [
    "assets/**/*.dae",
    "assets/**/*.STL",
    "assets/**/*.urdf",
]
