[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof_rl"
version = "0.1.0"
description = "External plugin package for z_rl"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["z_rl==0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["proof_rl*"]
